collector:
  poll_timeout_ms: 200

# Capture-first default for sandbox telemetry collection.
domains:
  process: true
  file: true
  syscall: false

  # Socket lifecycle + socket I/O events. The network eBPF module is now compiled
  # into the BPF object, so this captures the full socket-first taxonomy (control
  # plane + data plane). This is a high-volume "everything on" profile; per-kind
  # runtime toggles can trim it later (see docs/roadmap.md, Milestone 2).
  network_socket: true

  dns: false
  http: false
  https: false

# v1 file probes currently implemented.
file_probes:
  openat: true
  unlinkat: true
  renameat2: true

sink:
  # File sink is mandatory. Collector appends to this file and rotates by
  # deleting/recreating once max_file_size_bytes is reached.
  path: /tmp/etracegen/events.ndjson
  max_file_size_bytes: 104857600
